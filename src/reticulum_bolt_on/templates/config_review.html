{% extends 'base.html' %}{% block content %}<h1>Review persistent interface change</h1><p class="notice">This changes only the Reticulum config file. Live interface reload is never used.</p><section class="card">{% for key,value in details %}<p><b>{{ key }}:</b> {{ value }}</p>{% endfor %}</section><h2>Exact proposed diff</h2><pre>{{ diff }}</pre><form method="post" action="{{ url_for('execute_interface_config') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label><input type="checkbox" name="confirm" value="yes" required> I confirm this persistent configuration change.</label><button class="danger-button">Save configuration</button></form>{% endblock %}
