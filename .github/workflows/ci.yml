name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install -e '.[test]'
      - run: pytest --cov=reticulum_bolt_on --cov-report=term-missing
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[test]'
      - run: pytest tests/test_detection.py tests/test_lifecycle.py tests/test_management_helper.py tests/test_subprocess_runner.py tests/test_windows_backend.py tests/test_windows_support.py
      - name: Parse Windows lifecycle scripts
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("${{ github.workspace }}\install.ps1", [ref]$null, [ref]$errors)
          [void][System.Management.Automation.Language.Parser]::ParseFile("${{ github.workspace }}\uninstall.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("${{ github.workspace }}\install.ps1", [ref]$null, [ref]$errors)
          [void][System.Management.Automation.Language.Parser]::ParseFile("${{ github.workspace }}\uninstall.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Execute lifecycle CIM query with Windows PowerShell 5.1
        shell: powershell
        run: python -m pytest tests/test_lifecycle.py::test_windows_powershell_51_executes_exact_lifecycle_cim_query
      - name: Execute Python preflight probes with Windows PowerShell 5.1
        shell: powershell
        run: |
          python -m pip install rns==1.5.7
          $python = (Get-Command python).Source
          $version = & $python -c 'import sys; print(sys.version_info.major,sys.version_info.minor,sys.version_info.micro,sep=chr(46))'
          if ($LASTEXITCODE -ne 0 -or [version]$version -lt [version]'3.10') { throw "Version probe failed: $version" }
          & $python -c 'import venv'
          if ($LASTEXITCODE -ne 0) { throw 'venv probe failed' }
          $rnsVersion = & $python -c 'import RNS; print(RNS.__version__)'
          if ($LASTEXITCODE -ne 0 -or $rnsVersion.Trim() -ne '1.5.7') { throw "RNS probe failed: $rnsVersion" }
      - name: Launch generated GUI task with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP ('bolt-on-' + [guid]::NewGuid().ToString('N'))
          $fakeBin = Join-Path $testRoot 'bin'
          $configDir = Join-Path $testRoot 'reticulum'
          $taskName = 'Reticulum-Bolt-On-Admin'
          New-Item -ItemType Directory -Force -Path $fakeBin, $configDir | Out-Null
          Set-Content -LiteralPath (Join-Path $configDir 'config') -Value '[reticulum]'
          Set-Content -LiteralPath (Join-Path $fakeBin 'rnstatus.cmd') -Value '@echo {"interfaces":[]}'
          Set-Content -LiteralPath (Join-Path $fakeBin 'rnpath.cmd') -Value '@echo []'
          $oldLocalAppData = $env:LOCALAPPDATA
          $oldPath = $env:PATH
          try {
            $env:LOCALAPPDATA = $testRoot
            $env:PATH = "$fakeBin;$oldPath"
            $selectedPython = (Get-Command python).Source
            $expectedPythonw = Join-Path (Split-Path -Parent $selectedPython) 'pythonw.exe'
            & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\install.ps1" -Config (Join-Path $configDir 'config') -Yes -NoStart
            if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
            $installedTask = Get-ScheduledTask -TaskName $taskName
            if ($installedTask.Actions.Execute -ine $expectedPythonw) { throw "Task must execute selected pythonw.exe, got: $($installedTask.Actions.Execute)" }
            Start-ScheduledTask -TaskName $taskName
            $deadline = (Get-Date).AddSeconds(30)
            do {
              $listener = Get-NetTCPConnection -LocalAddress '127.0.0.1' -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue
              if ($listener) { break }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            if (-not $listener) { throw 'Generated launcher did not listen on 127.0.0.1:8080' }
            $listenerPid = [int]$listener.OwningProcess
            $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8080/setup'
            if ($response.StatusCode -ne 200) { throw "Unexpected GUI response: $($response.StatusCode)" }
            $task = Get-ScheduledTask -TaskName $taskName
            if ($task.State -ne 'Running') { throw 'Scheduled Task did not remain running' }
            if ($task.Settings.DisallowStartIfOnBatteries -ne $false) { throw 'Task incorrectly disallows start on battery' }
            if ($task.Settings.StopIfGoingOnBatteries -ne $false) { throw 'Task incorrectly stops on battery transition' }
            Stop-ScheduledTask -TaskName $taskName
            $deadline = (Get-Date).AddSeconds(15)
            do {
              $listener = Get-NetTCPConnection -LocalAddress '127.0.0.1' -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue
              $processAlive = Get-Process -Id $listenerPid -ErrorAction SilentlyContinue
              if (-not $listener -and -not $processAlive) { break }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            if ($listener) { throw 'Scheduled Task did not stop the generated GUI launcher cleanly' }
            if (Get-Process -Id $listenerPid -ErrorAction SilentlyContinue) { throw 'Scheduled Task left its exact GUI process running' }
          } finally {
            Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            $env:LOCALAPPDATA = $testRoot
            & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\uninstall.ps1" -Yes -Purge
            $env:LOCALAPPDATA = $oldLocalAppData
            $env:PATH = $oldPath
            Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
  container-architectures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: reticulum-bolt-on-admin:ci-${{ matrix.tag }}
      - name: Validate Reticulum utilities and observer-only process
        env:
          IMAGE: reticulum-bolt-on-admin:ci-${{ matrix.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" "$IMAGE" rnstatus --version
          docker run --rm --platform "$PLATFORM" "$IMAGE" rnpath --help
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "observer"
          bash tests/test_docker_sanitized_runtime.sh "$IMAGE" "$PLATFORM"
          bash tests/test_management_paths_integration.sh "$IMAGE" "$PLATFORM"

