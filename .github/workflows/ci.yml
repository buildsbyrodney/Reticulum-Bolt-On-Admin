name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install -e '.[test]'
      - run: pytest --cov=reticulum_bolt_on --cov-report=term-missing
  container-architectures:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: reticulum-bolt-on-admin:ci-${{ matrix.tag }}
      - name: Validate Reticulum utilities and observer-only process
        env:
          IMAGE: reticulum-bolt-on-admin:ci-${{ matrix.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" "$IMAGE" rnstatus --version
          docker run --rm --platform "$PLATFORM" "$IMAGE" rnpath --help
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "observer"
          bash tests/test_docker_sanitized_runtime.sh "$IMAGE" "$PLATFORM"

