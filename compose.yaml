services:
  observation-helper:
    build: .
    user: "0:0"
    network_mode: host
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp"]
    command:
      - reticulum-bolt-on-sanitize
      - --source
      - /source/config
      - --output-dir
      - /observer-data
      - --source-display-path
      - "${RETICULUM_DIR:?set RETICULUM_DIR}/config"
      - --storage-display-path
      - "${RETICULUM_DIR:?set RETICULUM_DIR}/storage"
      - --deployment-type
      - docker
      - --watch-seconds
      - "30"
    volumes:
      - "${RETICULUM_DIR:?set RETICULUM_DIR}:/source:ro"
      - "${BOLT_ON_OBSERVER_DATA:-./observer-data}:/observer-data"
    restart: unless-stopped
  observer:
    build: .
    network_mode: host
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp"]
    environment:
      BOLT_ON_SECRET_KEY: "${BOLT_ON_SECRET_KEY:?set BOLT_ON_SECRET_KEY}"
      BOLT_ON_DATABASE: /state/observer.db
      BOLT_ON_SNAPSHOT_DIR: /observer-data
    volumes:
      - "${BOLT_ON_OBSERVER_DATA:-./observer-data}:/observer-data:ro"
      - "${BOLT_ON_STATE:-./state}:/state"
    depends_on: [observation-helper]
    restart: unless-stopped
# The root helper has host networking only to perform authenticated read-only
# rnstatus/rnpath queries. It has no capabilities and performs a one-way
# production-data to sanitized-JSON transformation. The web container remains
# non-root and never receives the production mount, identity or RPC key.
# Deliberately absent: privileged mode, Docker socket, Reticulum/rnsd service.

