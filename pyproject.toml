[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reticulum-bolt-on-admin"
version = "0.2.0"
description = "A conservative observer-first web admin with capability-gated management for existing Reticulum installations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Flask>=3.1,<4", "gunicorn>=23,<24", "waitress>=3,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
reticulum-bolt-on-admin = "reticulum_bolt_on.app:main"
reticulum-bolt-on-detect = "reticulum_bolt_on.detection:main"
reticulum-bolt-on-sanitize = "reticulum_bolt_on.sanitizer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reticulum_bolt_on = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

